name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh_images:
        description: Build the box images even when the image cache has them (on main, the new build replaces the cached one)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Everything that needs no docker daemon: format, lint, the Rust tests
  # (they drive a fake docker) and the suite runner's own test.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --locked

      - name: Test the suite runner
        run: bash tests/test_run_all_suites.sh

      - name: Test the image cache script
        run: bash tests/test_ci_images.sh

  # On every push to main: make sure the image cache
  # (ghcr.io/<owner>/<repository>-cache:<fingerprint>) holds the relay,
  # docker and sysbox images for main's inputs, so suite runs whose image
  # inputs match main pull them in minutes instead of building them for
  # most of an hour and a half. Every decision is in scripts/ci/images
  # (tested by tests/test_ci_images.sh); see docs/testing.md, "Image cache".
  #
  # Only this job pushes to the cache, and only from main: what it builds
  # is reviewed, merged code. Pull requests (Dependabot's included, whose
  # token is read-only anyway) get a token that only reads packages and
  # only pull; if they could push, a pull request could put an image under
  # a fingerprint that later runs trust. A workflow_dispatch run on main
  # with fresh_images rebuilds the images and replaces the cached ones (for
  # example to pick up newer unpinned tools).
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-cache
      cancel-in-progress: false
    env:
      LBX_IMAGE_CACHE_PUSH: "1"
      LBX_IMAGE_FRESH: ${{ inputs.fresh_images }}
      DOCKER_BUILDKIT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null
          sudo apt-get clean
          df -h /

      # ./build and scripts/ci/images ask the launcher for the image names.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the launcher
        run: cargo build --locked

      # Registry names are lowercase; the repository name need not be.
      - name: Name the image cache
        run: echo "LBX_IMAGE_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}-cache" >> "$GITHUB_ENV"

      # Registry digest reads need the buildx plugin, which hosted runners carry.
      - name: Check docker buildx
        run: docker buildx version

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the images main's inputs need
        run: |
          ( while sleep 120; do echo "disk: $(df -h / | tail -1)  mem: $(free -m | awk '/Mem:/{print $7" MB free"}')"; done ) &
          scripts/ci/images relay docker sysbox

  # The suites in tests/ build the box images (several gigabytes each, with
  # a Rust toolchain compiled inside) and need a real docker daemon, sysbox
  # and root. A hosted runner has 4 cores and 16 GB; BuildKit's final
  # "exporting layers" step of a 9 GB image stalled there twice and the
  # runner was shut down, so the images are built with the classic builder
  # (DOCKER_BUILDKIT=0), which commits each layer as its instruction
  # finishes. The vm suite needs /dev/kvm, which hosted runners do not have;
  # its checks are approved skips.
  #
  # The images come from the image cache when their inputs match an image
  # main pushed (scripts/ci/images; on main this job therefore waits for
  # the images job, and runs whatever that job's result was: on a failure
  # it builds locally). The cache is read-only here: pull requests run
  # code nobody has reviewed yet, so this job's token only reads packages;
  # on a miss it builds locally and pushes nothing. A failed login (a
  # token that cannot read the package) only means building locally.
  suites:
    needs: images
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      LBX_BIN: ${{ github.workspace }}/target/debug/lbx
      LBX_IMAGE_FRESH: ${{ inputs.fresh_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A hosted runner starts with about 13 GB free and the images need
      # more; the preinstalled toolchains the job never uses are the bulk
      # of what can be freed.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null
          sudo apt-get clean
          df -h /
          # The unattended-run check wants alpine:3, which the prune removed.
          docker pull -q alpine:3

      - name: Prepare the unattended-run test host
        run: sudo tests/setup-run-test-host.sh "$USER"

      - name: Install test prerequisites
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qemu-utils rsync e2fsprogs procps iproute2 python3 curl openssh-client jq

      # sysbox, for the suites that drive it: the sysbox runtime suite, the
      # migration suite and T18 of the sessions suite exercise the real
      # runtime and skip without it, and a skip that is not approved fails
      # the run, so the runtime is installed rather than skipped. sysbox-fs
      # needs fusermount3 from fuse3, which the sysbox-ce package does not
      # declare (it declares fuse v2 only), and sysbox 0.7.1 is the first
      # release that declares the `time` Linux namespace, without which
      # containerd 2.x (Docker 28+) cannot create a container at all.
      - name: Install sysbox
        run: |
          set -euo pipefail
          SYSBOX_VERSION=0.7.1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends fuse3
          curl -fsSL -o /tmp/sysbox-ce.deb \
            "https://downloads.nestybox.com/sysbox/releases/v${SYSBOX_VERSION}/sysbox-ce_${SYSBOX_VERSION}-0.linux_amd64.deb"
          sudo dpkg -i /tmp/sysbox-ce.deb
          sysbox-runc --version
          # The runtime must be registered with the daemon before the suites
          # ask for it; the package's postinst starts the daemons.
          for i in $(seq 1 30); do
            docker info --format '{{json .Runtimes}}' | grep >/dev/null sysbox-runc && break
            sleep 1
          done
          docker info --format '{{json .Runtimes}}'

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the launcher
        run: cargo build --locked

      - name: Name the image cache
        run: echo "LBX_IMAGE_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}-cache" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io to read the image cache
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || echo "No image cache login; the images will be built."

      # The runner pulls or builds the images (relay, docker, and sysbox
      # when the runtime is there), then runs every suite as the user and
      # the root-only ones again as root.
      - name: Pull or build the images and run the suites
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          df -h / /tmp
          echo "user $(id) umask $(umask)"
          # The runner process starts with a group-writable umask; lbx refuses
          # a config file others can write, as a user's shell would not make.
          umask 022
          ( while sleep 120; do echo "disk: $(df -h / | tail -1)  mem: $(free -m | awk '/Mem:/{print $7" MB free"}')"; done ) &
          tests/run-all-suites.sh --lbx target/debug/lbx --logs test-logs

      - name: Job summary
        if: always()
        run: cat test-logs/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: test-logs/
          retention-days: 14
          if-no-files-found: ignore
