name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything that needs no docker daemon: format, lint, the Rust tests
  # (they drive a fake docker) and the suite runner's own test.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --locked

      - name: Test the suite runner
        run: bash tests/test_run_all_suites.sh

  # The suites in tests/ build the box images (several gigabytes each, with
  # a Rust toolchain compiled inside) and need a real docker daemon, sysbox
  # and root. A hosted runner has 4 cores and 16 GB; BuildKit's final
  # "exporting layers" step of a 9 GB image stalled there twice and the
  # runner was shut down, so the images are built with the classic builder
  # (DOCKER_BUILDKIT=0), which commits each layer as its instruction
  # finishes. The vm suite needs /dev/kvm, which hosted runners do not have;
  # its checks are approved skips.
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LBX_BIN: ${{ github.workspace }}/target/debug/lbx
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A hosted runner starts with about 13 GB free and the images need
      # more; the preinstalled toolchains the job never uses are the bulk
      # of what can be freed.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null
          sudo apt-get clean
          df -h /
          # The unattended-run check wants alpine:3, which the prune removed.
          docker pull -q alpine:3

      - name: Prepare the unattended-run test host
        run: sudo tests/setup-run-test-host.sh "$USER"

      - name: Install test prerequisites
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qemu-utils rsync e2fsprogs procps iproute2 python3 curl openssh-client jq

      # sysbox, for the suites that drive it: the sysbox runtime suite, the
      # migration suite and T18 of the sessions suite exercise the real
      # runtime and skip without it, and a skip that is not approved fails
      # the run, so the runtime is installed rather than skipped. sysbox-fs
      # needs fusermount3 from fuse3, which the sysbox-ce package does not
      # declare (it declares fuse v2 only), and sysbox 0.7.1 is the first
      # release that declares the `time` Linux namespace, without which
      # containerd 2.x (Docker 28+) cannot create a container at all.
      - name: Install sysbox
        run: |
          set -euo pipefail
          SYSBOX_VERSION=0.7.1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends fuse3
          curl -fsSL -o /tmp/sysbox-ce.deb \
            "https://downloads.nestybox.com/sysbox/releases/v${SYSBOX_VERSION}/sysbox-ce_${SYSBOX_VERSION}-0.linux_amd64.deb"
          sudo dpkg -i /tmp/sysbox-ce.deb
          sysbox-runc --version
          # The runtime must be registered with the daemon before the suites
          # ask for it; the package's postinst starts the daemons.
          for i in $(seq 1 30); do
            docker info --format '{{json .Runtimes}}' | grep >/dev/null sysbox-runc && break
            sleep 1
          done
          docker info --format '{{json .Runtimes}}'

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the launcher
        run: cargo build --locked

      # The runner builds the images itself (relay, docker, and sysbox when
      # the runtime is there), then runs every suite as the user and the
      # root-only ones again as root.
      - name: Build the images and run the suites
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          df -h / /tmp
          echo "user $(id) umask $(umask)"
          # The runner process starts with a group-writable umask; lbx refuses
          # a config file others can write, as a user's shell would not make.
          umask 022
          ( while sleep 120; do echo "disk: $(df -h / | tail -1)  mem: $(free -m | awk '/Mem:/{print $7" MB free"}')"; done ) &
          tests/run-all-suites.sh --lbx target/debug/lbx --logs test-logs

      - name: Job summary
        if: always()
        run: cat test-logs/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/
          retention-days: 14
          if-no-files-found: ignore
