name: Release

# When a GitHub release vX.Y.Z is published (gh release create vX.Y.Z
# --generate-notes): build the launcher as a static Linux binary, attach it
# and its checksum to the release, and append the block a downstream
# consumer parses to the release notes. Nothing is pushed to an image
# registry; the box images are built locally with ./build.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate tag
        id: validate
        env:
          # tag_name is "vX.Y.Z" (no refs/tags/ prefix) for the release event.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Tag does not match semantic version pattern v*.*.* (got: ${TAG_NAME})" >&2
            exit 1
          fi

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/lbx lbx-x86_64-unknown-linux-musl
          sha256sum lbx-x86_64-unknown-linux-musl > lbx-x86_64-unknown-linux-musl.sha256
          cat lbx-x86_64-unknown-linux-musl.sha256

      - name: Release notes
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "<!-- llm-in-a-box release: begin -->"
            echo "- Tag: $TAG_NAME"
            echo "- Commit: $COMMIT"
            echo "- Binary: lbx-x86_64-unknown-linux-musl (sha256 in lbx-x86_64-unknown-linux-musl.sha256)"
            echo "<!-- llm-in-a-box release: end -->"
          } > release-notes.md
          cat release-notes.md

      - name: Attach the binary and the notes to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: release-notes.md
          append_body: true
          files: |
            lbx-x86_64-unknown-linux-musl
            lbx-x86_64-unknown-linux-musl.sha256
          fail_on_unmatched_files: true
