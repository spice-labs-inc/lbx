name: Release

# On a tag vX.Y.Z: build the launcher as a static Linux binary, attach it
# and its checksum to a GitHub release of that tag, and write the block a
# downstream consumer parses into the release body. Nothing is pushed to an
# image registry; the box images are built locally with ./build.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A release tag is vMAJOR.MINOR.PATCH: three decimal numbers without
      # leading zeros and no suffix. Anything else stops here, before a
      # build or a release exists.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v0.*|v[1-9]*) ;;
            *) echo "refusing tag '$TAG': a release tag is vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          echo "$TAG" | LC_ALL=C grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "refusing tag '$TAG': a release tag is vMAJOR.MINOR.PATCH (for example v0.1.0)" >&2; exit 1; }

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/lbx lbx-x86_64-unknown-linux-musl
          sha256sum lbx-x86_64-unknown-linux-musl > lbx-x86_64-unknown-linux-musl.sha256
          cat lbx-x86_64-unknown-linux-musl.sha256

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "<!-- llm-in-a-box release: begin -->"
            echo "- Tag: $TAG"
            echo "- Commit: $COMMIT"
            echo "- Binary: lbx-x86_64-unknown-linux-musl (sha256 in lbx-x86_64-unknown-linux-musl.sha256)"
            echo "<!-- llm-in-a-box release: end -->"
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            lbx-x86_64-unknown-linux-musl
            lbx-x86_64-unknown-linux-musl.sha256
          fail_on_unmatched_files: true
