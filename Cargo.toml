[package]
name = "lbx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "llm-in-a-box: run coding agents in locked-down boxes (docker, sysbox or a qemu vm)"
repository = "https://github.com/spice-labs-inc/lbx"
readme = "README.md"
keywords = ["sandbox", "docker", "qemu", "agents"]
categories = ["command-line-utilities", "virtualization"]
rust-version = "1.88"

[lib]
name = "lbx"
path = "src/lib.rs"

[[bin]]
name = "lbx"
path = "src/main.rs"

[[bin]]
name = "fake-docker"
path = "src/bin/fake-docker.rs"
# A test helper only: `cargo install lbx` yields just lbx. The crate's own
# tests turn the feature on through the self dev-dependency below.
required-features = ["fake-docker"]

[features]
default = []
fake-docker = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
lbx = { path = ".", features = ["fake-docker"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["filters"] }
trycmd = "1.2"
expectrl = "=0.9.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
