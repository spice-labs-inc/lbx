# llm-in-a-box VM store ordering (2026-09-10)
#
# The setup unit (llm-in-a-box-setup.service) is ordered Before= this unit
# so the Docker store image is mounted before containerd starts. That Before=
# alone is not enough for a socket-activated daemon: containerd can be pulled
# in by docker.service or by a socket unit at any time, and systemd only
# breaks the ordering cycle by skipping the setup unit. Wants= + After= here
# make every path into containerd.service wait for the store wiring, so
# containerd never starts against an unmounted store.
[Unit]
After=llm-in-a-box-setup.service
Wants=llm-in-a-box-setup.service
