# llm-in-a-box VM store ordering (2026-09-10)
#
# The setup unit (llm-in-a-box-setup.service) is ordered Before= this unit
# so the Docker store image is mounted before dockerd starts. That Before=
# alone is not enough for a socket-activated daemon: docker.socket can pull
# docker.service in at any time, and systemd only breaks the ordering cycle
# by skipping the setup unit. Wants= + After= here make every path into
# docker.service wait for the store wiring, so the daemons never start
# against an unmounted store.
[Unit]
After=llm-in-a-box-setup.service
Wants=llm-in-a-box-setup.service
